syntax = "proto3";

option csharp_namespace = "Aoba.RPC.Account";
package aoba;

import "google/protobuf/empty.proto";
import "Proto/Types/Auth.proto";
import "Proto/Types/Common.proto";

service AccountRpc {
  rpc RegisterPasskey(google.protobuf.Empty) returns (PasskeyCreationResponse);
  rpc CompletePasskeyRegistration(PasskeyRegistrationCredentials)
      returns (google.protobuf.Empty);
  rpc GetUserSessions(google.protobuf.Empty) returns (UserSessionListResponse);
  rpc RefreshSession(google.protobuf.Empty) returns (LoginResponse);
  rpc RevokeSession(Id) returns (google.protobuf.Empty);
}
