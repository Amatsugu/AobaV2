syntax = "proto3";
package aoba;

import "google/protobuf/empty.proto";

option csharp_namespace = "Aoba.RPC.Models";
import "Proto/Types/Common.proto";


message Jwt {
  string token = 1;
}

message Credentials {
  string user = 1;
  string password = 2;
}

message PasskeyAssertionResponse {
  oneof result {
    PasskeyAssertionOptions options = 1;
    string error_message = 2;
  }
}

message PasskeyLoginRequest {
  string id = 1;
  Id ceremony_id = 2;
  bytes raw_id = 3;
  bytes client_data_json = 4;
  bytes authenticator_data = 5;
  bytes signature = 6;
  optional bytes user_handle = 7;
}

message PasskeyCreationResponse {
  oneof result {
    PasskeyCredentialCreateOptions options = 1;
    Error error = 2;
  }
}

message PasskeyCredentialCreateOptions {
  bytes challenge = 1;
  PublicKeyCredentialUser user = 2;
  PublicKeyCredentialRpEntity rp = 3;
  repeated PubKeyCredParam pubkey_params = 4;
}

message PubKeyCredParam {
  int32 alg = 1;
  string type = 2;
}

message PublicKeyCredentialRpEntity {
  string id = 1;
  optional string icon = 2;
  string name = 3;
}

message PublicKeyCredentialUser {
  bytes id = 1;
  string name = 2;
  string display_name = 3;
}

message PasskeyRegistrationCredentials {
  string id = 1;
  bytes raw_id = 2;
  bytes client_data_json = 3;
  bytes attestation_object = 4;
  bytes authenticator_data = 5;
  bytes signature = 6;
  optional bytes user_handle = 7;
}

message PasskeyAssertionOptions {
  Id ceremony_id = 1;
  bytes challenge = 2;
  optional string rp_id = 3;
  bytes authenticator_data = 5;
  bytes signature = 6;
}

message LoginResponse {
  oneof result {
    Jwt jwt = 1;
    Error error = 2;
  }
}

