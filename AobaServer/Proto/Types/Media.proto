syntax = "proto3";
package aoba;

import "google/protobuf/empty.proto";

option csharp_namespace = "Aoba.RPC.Models";
import "Proto/Types/Common.proto";


message MediaThumbnail {
  ThumbnailSize size = 1;
  string url = 2;
}

message MediaModel {
  Id id = 1;
  string filename = 2;
  MediaType media_type = 3;
  string ext = 4;
  int32 view_count = 5;
  Id owner = 6;
  string thumb_url = 7;
  string media_url = 8;
  MediaClass class = 9;
  repeated MediaThumbnail thumbnails = 10;
  repeated string tags = 11;
  string cdn_url = 12;
  optional Dimensions dimensions = 13;
}

enum ThumbnailSize {
  THUMBNAIL_SIZE_UNSPECIFIED = 0;
  THUMBNAIL_SIZE_SMALL = 128;
  THUMBNAIL_SIZE_MEDIUM = 256;
  THUMBNAIL_SIZE_LARGE = 512;
  THUMBNAIL_SIZE_EXTRA_LARGE = 1024;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_AUDIO = 2;
  MEDIA_TYPE_VIDEO = 3;
  MEDIA_TYPE_TEXT = 4;
  MEDIA_TYPE_CODE = 5;
  MEDIA_TYPE_RAW = 6;
}

enum MediaClass {
  MEDIA_CLASS_UNSPECIFIED = 0;
  MEDIA_CLASS_STANDARD = 1;
  MEDIA_CLASS_NSFW = 2;
  MEDIA_CLASS_SECRET = 3;
}

message MediaResponse {
  optional MediaModel value = 1;
}

message ListResponse {
  repeated MediaModel items = 1;
  Pagination pagination = 2;
}

message SetMediaClassRequest {
  Id id = 1;
  MediaClass class = 2;
}

message SetMediaClassBulkRequest {
  IdList ids = 1;
  MediaClass class = 2;
}


message Dimensions{
    uint32 height = 1;
    uint32 width = 2;
}


message TagUpateRequest{
	Id media_id = 1;
	repeated string tags = 2;
}

message BulkTagUpateRequest{
	IdList media_ids = 1;
	repeated string tags = 2;
}

message UploadRequest {
  repeated FileInfo files = 1;
}

message FileInfo {
  string filename = 1;
  uint64 size = 2;
}

message UploadTargetResponse {
  oneof result {
    UploadTargets targets = 1;
    string error = 2;
  }
}

message UploadTargets {
  repeated UploadTarget targets = 1;
}

message UploadTarget {
  string signed_url = 1;
  string filename = 2;
  string content_type = 3;
  Id id = 4;
}

message UploadResult {
  uint32 upload_count = 1;
  optional ErrorList errors = 2;
}