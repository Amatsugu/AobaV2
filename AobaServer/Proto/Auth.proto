syntax = "proto3";

option csharp_namespace = "Aoba.RPC.Auth";
package aoba;

import "google/protobuf/empty.proto";
import "Proto/Types/Common.proto";
import "Proto/Types/Auth.proto";

service AuthRpc {
	rpc Login(Credentials) returns (LoginResponse);
	rpc GetAssertionOptions(google.protobuf.Empty) returns (PasskeyAssertionResponse);
	rpc LoginPasskey(PasskeyLoginRequest) returns (LoginResponse);
}